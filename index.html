<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Graceful local WebSocket patch to suppress dev WebSocket / HMR warning spams in sandboxed environments
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        function PatchedWebSocket(url, protocols) {
          let ws;
          try {
            if (protocols) {
              ws = new OriginalWebSocket(url, protocols);
            } else {
              ws = new OriginalWebSocket(url);
            }
          } catch (e) {
            console.log("[Vite Companion Info] Handled transient dev websocket connection failure.");
            ws = {};
          }

          // Force a quiet error handler to avoid red uncaught alerts
          const silentOnError = (e) => {
            console.log("[Vite Companion Info] Quietly bypassed local dev HMR connection check.");
          };

          if (ws.addEventListener) {
            const originalAddEventListener = ws.addEventListener;
            ws.addEventListener = function(type, listener, options) {
              if (type === 'error') {
                const wrappedListener = function(event) {
                  silentOnError(event);
                  if (listener) {
                    try { listener.call(this, event); } catch (err) {}
                  }
                };
                return originalAddEventListener.call(ws, type, wrappedListener, options);
              }
              return originalAddEventListener.call(ws, type, listener, options);
            };
          } else {
            ws.addEventListener = function() {};
            ws.removeEventListener = function() {};
            ws.close = function() {};
            ws.send = function() {};
          }

          // Suppress on-error throwbacks
          try {
            let customOnError = null;
            Object.defineProperty(ws, 'onerror', {
              get: function() { return customOnError; },
              set: function(val) {
                customOnError = val;
                if (ws.addEventListener) {
                  ws.addEventListener('error', val);
                }
              },
              configurable: true
            });
          } catch (e) {
            try {
              ws.onerror = function(event) {
                silentOnError(event);
              };
            } catch (innerErr) {}
          }

          return ws;
        }

        // Copy prototype and static constants (CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3)
        PatchedWebSocket.prototype = OriginalWebSocket.prototype;
        for (let key in OriginalWebSocket) {
          if (OriginalWebSocket.hasOwnProperty(key)) {
            PatchedWebSocket[key] = OriginalWebSocket[key];
          }
        }
        
        // Define standard readyState constants directly on the function too, just in case
        PatchedWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = OriginalWebSocket.OPEN;
        PatchedWebSocket.CLOSING = OriginalWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = OriginalWebSocket.CLOSED;

        window.WebSocket = PatchedWebSocket;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
